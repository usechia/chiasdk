name: Release MCP

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - beta

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release MCP Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Build SDK (dependency)
        run: |
          pnpm --filter @chiahq/sdk build
          test -f packages/sdk/dist/index.d.ts || (echo "SDK build failed - dist/index.d.ts not found" && exit 1)

      - name: Setup Release Environment
        id: setup
        run: |
          cd packages/mcp
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          RAW_VERSIONS=$(npm view @chiahq/mcp versions --json 2>/dev/null || true)
          ALL_VERSIONS=$(echo "$RAW_VERSIONS" | node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync(0,'utf-8'));
              console.log(JSON.stringify(Array.isArray(d) ? d : typeof d === 'string' ? [d] : []));
            } catch { console.log('[]'); }
          ")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current version from package.json: $CURRENT_VERSION"
          echo "All published versions: $ALL_VERSIONS"

          if [[ "$RELEASE_TYPE" == "beta" ]]; then
            echo "IS_BETA=true" >> $GITHUB_OUTPUT
            echo "TAG_NAME=beta" >> $GITHUB_OUTPUT

            LATEST_BETA=$(echo "$ALL_VERSIONS" | node -e "
              try {
                const versions = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
                const betas = versions.filter(v => v.includes('-beta.'));
                console.log(betas.length > 0 ? betas[betas.length - 1] : '');
              } catch (e) {
                console.log('');
              }
            ")

            echo "Latest published beta: $LATEST_BETA"

            if [[ -n "$LATEST_BETA" ]]; then
              BASE_VERSION=$(echo $LATEST_BETA | cut -d'-' -f1)
              BETA_NUM=$(echo $LATEST_BETA | cut -d'.' -f4)
              NEXT_BETA=$((BETA_NUM + 1))
              NEXT_VERSION="${BASE_VERSION}-beta.${NEXT_BETA}"
            else
              if [[ $CURRENT_VERSION == *"-beta."* ]]; then
                BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)
              else
                npm install -g semver
                BASE_VERSION=$(semver -i patch ${CURRENT_VERSION})
              fi
              NEXT_VERSION="${BASE_VERSION}-beta.1"
            fi
          else
            echo "IS_BETA=false" >> $GITHUB_OUTPUT
            echo "TAG_NAME=latest" >> $GITHUB_OUTPUT

            LATEST_VERSION=$(echo "$ALL_VERSIONS" | node -e "
              try {
                const versions = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
                const releases = versions.filter(v => !v.includes('-beta.'));
                console.log(releases.length > 0 ? releases[releases.length - 1] : '');
              } catch (e) {
                console.log('');
              }
            ")

            echo "Latest published version: $LATEST_VERSION"

            npm install -g semver

            if [[ -n "$LATEST_VERSION" ]]; then
              NEXT_VERSION=$(semver -i ${RELEASE_TYPE} ${LATEST_VERSION})
            else
              NEXT_VERSION=$(semver -i ${RELEASE_TYPE} ${CURRENT_VERSION})
            fi
          fi

          echo "Will publish version: $NEXT_VERSION"
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT

          npm version $NEXT_VERSION --no-git-tag-version --allow-same-version
          git add package.json
          git commit -m "chore: bump @chiahq/mcp to $NEXT_VERSION" || true

      - name: Update docs version badge (MCP)
        run: |
          VERSION=${{ steps.setup.outputs.VERSION }}
          DOC_FILE="docs/docs/mcp/overview.md"
          sed -i "s/<span className=\"version-badge\">v[^<]*<\\/span>/<span className=\"version-badge\">v${VERSION}<\\/span>/" "$DOC_FILE"
          if [[ -n "$(git status --porcelain "$DOC_FILE")" ]]; then
            git add "$DOC_FILE"
            git commit -m "docs: update mcp version badge to v${VERSION}" || true
          fi

      - name: Verify SDK is built
        run: |
          if [ ! -f packages/sdk/dist/index.d.ts ]; then
            echo "Error: SDK dist not found. Rebuilding..."
            pnpm --filter @chiahq/sdk build
          fi
          ls -la packages/sdk/dist/index.d.ts

      - name: Build MCP Server
        run: pnpm --filter @chiahq/mcp build

      - name: Update Changelog
        if: success()
        run: |
          cd packages/mcp
          VERSION=${{ steps.setup.outputs.VERSION }}
          IS_BETA=${{ steps.setup.outputs.IS_BETA }}

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md CHANGELOG.md.backup
          fi

          DATE=$(date +%Y-%m-%d)
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          cat > CHANGELOG_NEW.md << EOF
          # Changelog

          All notable changes to the Chia MCP Server will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [${VERSION}] - ${DATE}

          ### Changed

          - ${RELEASE_TYPE^} release

          EOF

          if [ -f CHANGELOG.md ]; then
            sed '1,7d' CHANGELOG.md >> CHANGELOG_NEW.md
          fi

          mv CHANGELOG_NEW.md CHANGELOG.md

          if [[ -n "$(git status --porcelain CHANGELOG.md)" ]]; then
            git add CHANGELOG.md
            git commit -m "docs: update changelog for @chiahq/mcp version ${VERSION}"
            git push origin ${{ github.ref_name }}
          fi

      - name: Setup npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          cd packages/mcp
          if [[ "${{ steps.setup.outputs.IS_BETA }}" == "true" ]]; then
            npm publish --tag beta --access public
          else
            npm publish --tag latest --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and Release
        if: success()
        run: |
          VERSION=${{ steps.setup.outputs.VERSION }}
          git tag mcp-v${VERSION}
          git push origin mcp-v${VERSION}

          if [[ "${{ steps.setup.outputs.IS_BETA }}" == "true" ]]; then
            gh release create mcp-v${VERSION} \
              --prerelease \
              --title "Chia MCP v${VERSION}" \
              --notes "$(cat packages/mcp/CHANGELOG.md | head -50)"
          else
            gh release create mcp-v${VERSION} \
              --title "Chia MCP v${VERSION}" \
              --notes "$(cat packages/mcp/CHANGELOG.md | head -50)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
